<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Valentine?</title>
  <meta name="description" content="A playful Valentine card asking 'Will you be my Valentine?' with animated hearts. Improved accessibility and reduced-motion support." />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1: #ff9a9e;
      --bg2: #fad0c4;
      --accent: #e63946;
      --muted: #555;
      --card-radius: 24px;
    }
    * { box-sizing: border-box; }
    html,body{height:100%;}
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      background: white;
      border-radius: var(--card-radius);
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
      z-index: 2;
      animation: popIn 0.8s ease;
      will-change: transform, opacity;
    }
    h1 {
      font-family: 'Pacifico', cursive;
      color: var(--accent);
      font-size: 2.4rem;
      margin-bottom: 12px;
    }
    p {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      position: relative;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: #f1f1f1;
      color: #555;
    }
    #yesBtn {
      background: var(--accent);
      color: white;
      box-shadow: 0 8px 20px rgba(230,57,70,0.4);
    }
    #yesBtn:hover {
      transform: scale(1.08);
    }
    #noBtn {
      background: #f1f1f1;
      color: #555;
      position: relative;
    }
    /* focus-visible for keyboard users */
    button:focus-visible {
      outline: 3px solid rgba(230,57,70,0.25);
      outline-offset: 2px;
    }

    .hearts {
      position: fixed; /* make hearts position relative to viewport */
      left: 0;
      bottom: 0;
      width: 100%;
      height: 0;
      pointer-events: none; /* don't block interactions */
      z-index: 1;
      overflow: visible;
    }
    .hearts span {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
      will-change: transform, opacity;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.9; }
      100% { transform: translateY(-120vh) scale(1.4); opacity: 0; }
    }
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .success {
      display: none;
    }
    .success h2 {
      font-family: 'Pacifico', cursive;
      color: var(--accent);
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    .success p {
      font-size: 1.1rem;
    }
    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .hearts span { animation: none !important; }
      #yesBtn:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Will you be my Valentine? 💖</h1>
    <p>I was wondering if you\'d make my February 14th extra special.</p>
    <div class="buttons">
      <button id="yesBtn" type="button" aria-label="Yes, I will be your Valentine">Yes 💘</button>
      <button id="noBtn" type="button" aria-label="No, thanks">No 🙈</button>
    </div>
    <div class="success" id="success" role="status" aria-live="polite">
      <h2>Yay!! 💕</h2>
      <p>You just made my heart very, very happy.<br>Happy Valentine’s Day 💌</p>
    </div>
  </div>

  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <script>
    (function(){
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      const success = document.getElementById('success');
      const buttons = document.querySelector('.buttons');
      const hearts = document.getElementById('hearts');
      let yesClicked = false;

      // Move the "No" button only on pointer enter (mouse/touch/pointer) to avoid
      // interfering with keyboard navigation. Do not move on focus.
      function moveNoButton() {
        const x = Math.random() * 96 + 2; // 2vw to 98vw
        const y = Math.random() * 40 - 20; // small vertical jitter
        noBtn.style.transform = `translate(${x}vw, ${y}px)`;
      }

      function resetNoButton() {
        noBtn.style.transform = '';
      }

      noBtn.addEventListener('pointerenter', moveNoButton);
      noBtn.addEventListener('pointerleave', resetNoButton);
      // Keep keyboard focus predictable — do not move on focus.

      yesBtn.addEventListener('click', () => {
        if (yesClicked) return; // debounce repeated clicks
        yesClicked = true;
        buttons.style.display = 'none';
        success.style.display = 'block';

        // If the user prefers reduced motion, do not launch hearts
        const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!prefersReduced) launchHearts();
      });

      function launchHearts() {
        // Create hearts with durations and remove them on animationend
        for (let i = 0; i < 25; i++) {
          const heart = document.createElement('span');
          heart.innerText = '❤️';
          // place between 2vw and 98vw so they start inside viewport
          heart.style.left = (Math.random() * 96 + 2) + 'vw';
          const duration = 4 + Math.random() * 3; // 4 to 7s
          heart.style.animationDuration = duration + 's';
          heart.setAttribute('aria-hidden', 'true');

          // remove when animation ends (robust)
          const onAnimEnd = () => {
            heart.removeEventListener('animationend', onAnimEnd);
            if (heart.parentNode) heart.parentNode.removeChild(heart);
          };
          heart.addEventListener('animationend', onAnimEnd);

          hearts.appendChild(heart);

          // In case animationend doesn\'t fire, set a fallback removal
          setTimeout(() => {
            if (heart.parentNode) heart.parentNode.removeChild(heart);
          }, (duration + 0.5) * 1000);
        }
      }

    })();
  </script>
</body>
</html>
